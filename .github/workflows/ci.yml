name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Jest Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: milktrace
          POSTGRES_PASSWORD: milktrace_dev
          POSTGRES_DB: milktrace
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    env:
      DATABASE_URL: postgresql://milktrace:milktrace_dev@localhost:5433/milktrace
      DIRECT_URL: postgresql://milktrace:milktrace_dev@localhost:5433/milktrace
      JWT_SECRET: super_secret_test_key
      JWT_EXPIRES_IN: 7d

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Apply Prisma Migrations
      run: npx prisma migrate deploy
    - name: Run Tests
      run: npm run test
